<div class="field">
  @if (label()) {
    <label class="field__label" [for]="id">
      {{ label() }}
      @if (required()) {
        <span class="field__required" aria-hidden="true">*</span>
      }
      @if (optional()) {
        <span class="field__optional">(optional)</span>
      }
    </label>
  }
  <div class="field__control">
    @if (multiline()) {
      <textarea
        class="field__input field__input--multiline"
        [class.field__input--invalid]="error() || invalid()"
        [id]="id"
        [placeholder]="placeholder()"
        [value]="value()"
        [attr.aria-label]="ariaLabel() || null"
        [attr.aria-required]="required() || null"
        [attr.aria-invalid]="error() || invalid() ? true : null"
        [attr.aria-describedby]="error() ? errorId : null"
        (input)="value.set($any($event.target).value)"
      ></textarea>
    } @else {
      <input
        class="field__input"
        [class.field__input--invalid]="error() || invalid()"
        [id]="id"
        [type]="type()"
        [placeholder]="placeholder()"
        [value]="value()"
        [attr.min]="min() || null"
        [attr.aria-label]="ariaLabel() || null"
        [attr.aria-required]="required() || null"
        [attr.aria-invalid]="error() || invalid() ? true : null"
        [attr.aria-describedby]="error() ? errorId : null"
        (input)="value.set($any($event.target).value)"
      />
    }
    @if (clearable()) {
      <app-delete-button [label]="'Clear ' + (label() || ariaLabel() || 'field')" (remove)="clear()" />
    }
  </div>
  @if (error()) {
    <p class="field__error" [id]="errorId">{{ error() }}</p>
  }
</div>
