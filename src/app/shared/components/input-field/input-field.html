<div class="field">
  @if (label()) {
    <label class="field__label" [for]="id">
      {{ label() }}
      @if (optional()) {
        <span class="field__optional">(optional)</span>
      }
    </label>
  }
  <div class="field__control">
    @if (multiline()) {
      <textarea
        class="field__input field__input--multiline"
        [id]="id"
        [placeholder]="placeholder()"
        [value]="value()"
        (input)="value.set($any($event.target).value)"
      ></textarea>
    } @else {
      <input
        class="field__input"
        [id]="id"
        [type]="type()"
        [placeholder]="placeholder()"
        [value]="value()"
        (input)="value.set($any($event.target).value)"
      />
    }
    @if (clearable()) {
      <app-delete-button [label]="'Clear ' + (label() || 'field')" (remove)="clear()" />
    }
  </div>
</div>
