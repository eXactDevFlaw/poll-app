<div class="dropdown">
  <button
    type="button"
    class="dropdown__trigger"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-required]="required() || null"
    [attr.aria-invalid]="error() ? true : null"
    [attr.aria-describedby]="error() ? errorId : null"
    (click)="toggle()"
  >
    <span>
      {{ keepPlaceholder() ? placeholder() : selected() || placeholder() }}
      @if (required()) {
        <span class="dropdown__required" aria-hidden="true">*</span>
      }
    </span>
    <span class="dropdown__arrow" [class.dropdown__arrow--open]="isOpen()">
      <img class="dropdown__arrow-icon" src="assets/img/arrow-drop-down.svg" alt="" />
      <img class="dropdown__arrow-icon dropdown__arrow-icon--hover" src="assets/img/arrow-drop-down-hover.svg" alt="" />
    </span>
  </button>

  @if (isOpen()) {
    <ul class="dropdown__list" [class.dropdown__list--right]="align() === 'right'" role="listbox">
      @for (option of options(); track option) {
        <li role="option" [attr.aria-selected]="option === selected()">
          <button
            type="button"
            class="dropdown__option"
            [class.dropdown__option--selected]="option === selected()"
            (click)="select(option)"
          >
            {{ option }}
          </button>
        </li>
      }
    </ul>
  }

  @if (error()) {
    <p class="dropdown__error" [id]="errorId">{{ error() }}</p>
  }
</div>
