<main class="create-survey">
  <header class="create-survey__header">
    <div class="create-survey__title-row">
      <app-survey-status status="draft" />
      <h1>Create new survey</h1>
    </div>
    <app-button variant="tertiary" routerLink="/">
      Cancel
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </app-button>
  </header>

  <section class="create-survey__panel">
    <app-survey-meta-form [categories]="categories" [meta]="meta()" (metaChange)="meta.set($event)" />

    @if (errorMessage()) {
      <p class="create-survey__error">{{ errorMessage() }}</p>
    }

    <div class="create-survey__questions">
      @for (question of questions(); track $index) {
        <app-question-block
          [index]="$index"
          [question]="question"
          (questionChange)="setQuestionAt($index, $event)"
          (remove)="removeQuestionAt($index)"
        />
      }
    </div>

    <app-add-question-btn (add)="addQuestion()" />

    <div class="create-survey__footer">
      <app-button variant="primary" [disabled]="!isValid() || isPublishing()" (buttonClick)="publish()">
        Publish
      </app-button>
    </div>
  </section>

  @if (showPublishedToast()) {
    <app-publish-overlay (close)="closeToast()" />
  }
</main>
