<div class="create-survey">
  <header class="create-survey__header">
    <div class="create-survey__title">
      <app-survey-status status="draft" />
      <h2 id="create-survey-title">Create new survey</h2>
    </div>
    <app-button variant="tertiary" (buttonClick)="cancelled.emit()">
      Cancel
      <img src="assets/img/close.svg" alt="" />
    </app-button>
  </header>

  <section class="create-survey__panel">
    <app-survey-meta-form
      [categories]="categories"
      [errors]="visibleMetaErrors()"
      [meta]="meta()"
      (metaChange)="meta.set($event)"
    />

    <div class="create-survey__questions">
      @for (question of questions(); track $index) {
        <app-question-block
          [index]="$index"
          [errors]="visibleQuestionErrors($index)"
          [question]="question"
          (questionChange)="setQuestionAt($index, $event)"
          (remove)="removeQuestionAt($index)"
        />
      }
    </div>

    <app-add-question-btn (add)="addQuestion()" />
  </section>

  <footer class="create-survey__footer">
    <p class="create-survey__legend"><span aria-hidden="true">*</span> Required fields</p>
    <div class="create-survey__actions">
      @if (showErrors() && !isValid()) {
        <p class="create-survey__error" role="alert">Please fill in all required fields marked with *.</p>
      }
      @if (errorMessage()) {
        <p class="create-survey__error" role="alert">{{ errorMessage() }}</p>
      }
      <app-button variant="primary" [disabled]="isPublishing()" (buttonClick)="publish()">Publish</app-button>
    </div>
  </footer>
</div>
