<div class="question-block">
  <div class="question-block__header">
    <span class="question-block__title">{{ index() + 1 }}. Question</span>
    <app-button variant="icon" (buttonClick)="onDelete()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
        <path d="M10 11v6"></path>
        <path d="M14 11v6"></path>
        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
      </svg>
    </app-button>
  </div>

  <app-input-field
    placeholder="Choose the activities you prefer"
    [value]="question().text"
    (valueChange)="setText($event)"
  />

  <div class="question-block__answers-header">
    <span class="question-block__answers-label">Answers</span>
    <label class="question-block__checkbox">
      <input
        type="checkbox"
        [checked]="question().allow_multiple"
        (change)="setAllowMultiple($any($event.target).checked)"
      />
      Allow multiple answers.
    </label>
  </div>

  @for (answer of question().answers; track $index) {
    <div class="question-block__answer">
      <span class="question-block__letter">{{ letterFor($index) }}.</span>
      <app-input-field [value]="answer" (valueChange)="setAnswer($index, $event)" />
      <app-button variant="icon" [disabled]="question().answers.length <= minAnswers" (buttonClick)="removeAnswer($index)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          <path d="M10 11v6"></path>
          <path d="M14 11v6"></path>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
        </svg>
      </app-button>
    </div>
  }

  <div class="question-block__add-answer">
    <app-button variant="tertiary" [disabled]="question().answers.length >= maxAnswers" (buttonClick)="addAnswer()">
      Add answer +
    </app-button>
    <span class="question-block__hint">You can add up to 6 answer fields.</span>
  </div>
</div>
