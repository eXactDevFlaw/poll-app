<div class="question-list">
  @for (question of questions(); track question.id; let qIndex = $index) {
    <fieldset class="question-list__item">
      <legend class="question-list__text">{{ qIndex + 1 }}. {{ question.text }}</legend>
      @if (question.allow_multiple) {
        <p class="question-list__hint">More than one answers are possible.</p>
      }
      @for (answer of question.answers; track answer.id; let aIndex = $index) {
        <app-answer-option
          [name]="'question-' + question.id"
          [letter]="letterFor(aIndex)"
          [label]="answer.text"
          [multiple]="question.allow_multiple"
          [checked]="isSelected(question.id, answer.id)"
          [disabled]="disabled()"
          (toggled)="answerToggled.emit({ question, answerId: answer.id })"
        />
      }
    </fieldset>
  }
</div>
