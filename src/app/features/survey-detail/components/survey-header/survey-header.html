<header class="survey-header">
  <app-survey-status [status]="state()" />
  <p class="survey-header__meta">
    <span>{{ deadline() }}</span>
    <span>Category: {{ survey().category }}</span>
  </p>
  <h1>{{ survey().name }}</h1>
  @if (survey().description) {
    <p class="survey-header__description">{{ survey().description }}</p>
  }
</header>
