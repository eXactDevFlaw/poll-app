<header class="survey-header">
  <div class="survey-header__top">
    <app-survey-status [status]="state()" />
    <span class="survey-header__meta">
      @if (survey().end_date) {
        {{ state() === 'ended' ? 'Ended on' : 'Ends on' }} {{ survey().end_date }}
      } @else {
        No end date
      }
      <span class="survey-header__category">Category: {{ survey().category }}</span>
    </span>
  </div>
  <h1>{{ survey().name }}</h1>
  @if (survey().description) {
    <p>{{ survey().description }}</p>
  }
</header>
