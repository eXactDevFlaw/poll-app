<main class="survey-detail">
  <header class="survey-detail__header">
    <a routerLink="/" class="survey-detail__logo-link" title="Back to all surveys">
      <img src="assets/img/logo-light.svg" alt="Poll App – back to all surveys" class="survey-detail__logo" />
    </a>
    <app-button variant="primary" routerLink="/" [queryParams]="{ create: 1 }">Create survey</app-button>
  </header>

  @if (isLoading()) {
    <p>Loading...</p>
  } @else if (!survey()) {
    <p>Survey not found.</p>
  } @else {
    <div class="survey-detail__content">
      <div class="survey-detail__card">
        <app-survey-header [survey]="survey()!" />
        @if (isEnded()) {
          <p class="survey-detail__ended">This survey has ended. You can still view the results, but no more answers are accepted.</p>
        }
        <app-question-list [questions]="questions()" />
        <div class="survey-detail__footer">
          <app-button variant="primary" [disabled]="true">{{ isEnded() ? 'Survey ended' : 'Complete survey' }}</app-button>
        </div>
      </div>

      <aside class="survey-detail__results">
        <app-empty-results />
      </aside>
    </div>
  }
</main>
