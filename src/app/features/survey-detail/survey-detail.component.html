<main class="survey-detail">
  <header class="survey-detail__header">
    <img src="assets/img/logo-light.svg" alt="Poll App" class="survey-detail__logo" />
    <app-button variant="primary" routerLink="/create">Create survey</app-button>
  </header>

  @if (isLoading()) {
    <p>Loading...</p>
  } @else if (!survey()) {
    <p>Survey not found.</p>
  } @else {
    <div class="survey-detail__content">
      <div class="survey-detail__card">
        <app-survey-header [survey]="survey()!" />
        <app-question-list [questions]="questions()" />
        <div class="survey-detail__footer">
          <app-button variant="primary" [disabled]="true">Complete survey</app-button>
        </div>
      </div>

      <aside class="survey-detail__results">
        <app-empty-results />
      </aside>
    </div>
  }
</main>
