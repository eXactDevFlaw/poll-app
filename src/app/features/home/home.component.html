<main class="home">
  <header class="header">
    <img src="assets/img/logo-light.svg" alt="Poll App" class="header__logo" />
  </header>

  <app-hero (newSurvey)="openCreate()" />

  <section class="surveys" aria-labelledby="surveys-title">
    <h2 id="surveys-title">Your surveys</h2>
    @if (isLoading()) {
      <p>Loading...</p>
    } @else {
      <app-ending-soon-section [surveys]="endingSoon()" />
      <app-survey-list [surveys]="surveys()" />
    }
  </section>

  @if (isCreateOpen()) {
    <div
      class="create-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="create-survey-title"
      (click)="closeOnBackdrop($event)"
    >
      <app-create-survey (cancelled)="closeCreate()" (published)="onPublished($event)" />
    </div>
  }

  @if (publishedSurvey()) {
    <app-publish-overlay (close)="closeToast()" />
  }
</main>
