<a class="survey-card" [routerLink]="['/survey', survey().id]">
  <span class="survey-card__category">{{ survey().category }}</span>
  <h3>{{ survey().name }}</h3>
  <div class="survey-card__footer">
    <app-survey-status [status]="state()" />
    <span class="survey-card__badge">{{ daysLabel() }}</span>
  </div>
</a>
