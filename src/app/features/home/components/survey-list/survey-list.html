<div class="survey-filters">
  <div class="survey-tabs" role="tablist" aria-label="Survey status">
    <button
      type="button"
      role="tab"
      class="survey-tabs__tab"
      [class.survey-tabs__tab--active]="activeTab() === 'active'"
      [attr.aria-selected]="activeTab() === 'active'"
      (click)="activeTab.set('active')"
    >
      Active survey
    </button>
    <button
      type="button"
      role="tab"
      class="survey-tabs__tab"
      [class.survey-tabs__tab--active]="activeTab() === 'past'"
      [attr.aria-selected]="activeTab() === 'past'"
      (click)="activeTab.set('past')"
    >
      Past survey
    </button>
  </div>

  <div class="survey-filters__category">
    <app-dropdown
      placeholder="Sort by categories"
      keepPlaceholder
      align="right"
      [options]="categoryOptions"
      [selected]="selectedCategory() || categoryOptions[0]"
      (selectedChange)="selectCategory($event)"
    />
    @if (selectedCategory()) {
      <span class="survey-filters__selected">{{ selectedCategory() }}</span>
    }
  </div>
</div>

<div role="tabpanel">
  @if (visibleSurveys().length) {
    <ul class="survey-list">
      @for (survey of visibleSurveys(); track survey.id) {
        <li>
          <app-survey-card [survey]="survey" />
        </li>
      }
    </ul>
  } @else {
    <p class="survey-list__empty">{{ emptyMessage() }}</p>
  }
</div>
